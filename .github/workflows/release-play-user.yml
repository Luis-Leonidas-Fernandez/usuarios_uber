name: CD Android Release (Usuario) to Google Play

on:
  push:
    tags:
      - "user-v*"

concurrency:
  group: cd-user-${{ github.ref }}
  cancel-in-progress: true        

jobs:
  cd-deploy-user:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3    

      - name: Flutter pub get
        run: flutter pub get

      # Parseamos el tag: user-v2.0.4+10 -> BUILD_NAME=2.0.4 | BUILD_NUMBER=10
      - name: Parse tag -> versionName/versionCode
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"  # ej: user-v2.0.4+10
          if [[ ! "$TAG" =~ ^user-v([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "Tag inválido. Usa: user-v<versionName>+<versionCode> (ej: user-v2.0.4+10)"
            exit 1
          fi
          NAME="${BASH_REMATCH[1]}"
          NUM="${BASH_REMATCH[2]}"
          echo "BUILD_NAME=$NAME" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$NUM" >> $GITHUB_OUTPUT
          echo "✔ Version => $NAME | Code => $NUM"

      - name: Write local.properties versions
        run: |
          mkdir -p android
          touch android/local.properties
          sed -i '/^flutter\.versionName=/d' android/local.properties || true
          sed -i '/^flutter\.versionCode=/d' android/local.properties || true
          {
            echo "flutter.versionName=${{ steps.parse.outputs.BUILD_NAME }}"
            echo "flutter.versionCode=${{ steps.parse.outputs.BUILD_NUMBER }}"
          } >> android/local.properties
          echo "✔ local.properties:"
          tail -n +1 android/local.properties

      - name: Restore keystore & key.properties
        run: |
          echo "$KS" | base64 -d > android/app/key.jks
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=key.jks
          EOF
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build appbundle (AAB)
        run: |
          flutter clean
          flutter build appbundle --release \
            --build-name="${{ steps.parse.outputs.BUILD_NAME }}" \
            --build-number="${{ steps.parse.outputs.BUILD_NUMBER }}"
          ls -lah build/app/outputs/bundle/release
      
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: usuario-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab    

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: "com.luisleonidasfernandez.flutterinri"
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed

      - name: Done
        run: echo "🎉 Usuario desplegado a Google Play con tag ${{ github.ref_name }}"
