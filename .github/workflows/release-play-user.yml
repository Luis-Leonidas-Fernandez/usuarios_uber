name: Android Release (Usuario) to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Track (internal, alpha, beta, production)"
        required: true
        default: "internal"
      build_name:
        description: "versionName (ej: 2.0.4)"
        required: true
        default: "2.0.4"
      build_number:
        description: "versionCode (ej: 10)"
        required: true
        default: "10"
      dry_run:
        description: "Solo compilar (no subir a Play)"
        required: true
        default: "true"

concurrency:
  group: user-${{ github.ref }}-${{ github.event.inputs.track }}
  cancel-in-progress: true        

jobs:
  build-and-deploy-user:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # (Opcional) UPDATED: cache de Gradle para acelerar builds
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3    

      - name: Flutter pub get
        run: flutter pub get

      # Escribimos la versión que leerá tu build.gradle desde local.properties

      - name: Write local.properties versions (idempotent)
        shell: bash
        run: |
          mkdir -p android
          touch android/local.properties
          # eliminar líneas previas, si las hubiera
          sed -i '/^flutter\.versionName=/d' android/local.properties || true
          sed -i '/^flutter\.versionCode=/d' android/local.properties || true
          # escribir valores actuales
          {
            echo "flutter.versionName=${{ github.event.inputs.build_name }}"
            echo "flutter.versionCode=${{ github.event.inputs.build_number }}"
          } >> android/local.properties
          echo "✔ local.properties:"
          tail -n +1 android/local.properties
      
      # UPDATED: restaura el keystore desde secret base64 y genera key.properties    
      - name: Restore keystore & key.properties
        run: |
          echo "$KS" | base64 -d > android/app/key.jks
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=key.jks
          EOF
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build appbundle (AAB)
        run: |
          flutter clean
          flutter build appbundle --release
          ls -lah build/app/outputs/bundle/release
      
      # guardar el .aab como artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: usuario-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab    
      
      
      # UPDATED: status=completed => queda enviado a revisión automáticamente

      - name: Upload to Google Play
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: "com.luisleonidasfernandez.flutterinri"
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed

      - name: Done
        run: echo "🎉 Usuario listo. Upload=${{ github.event.inputs.dry_run != 'true' && 'sí' || 'no (dry_run)'}}"
