name: Android Release (Usuario) to Google Play

on:
  push:
    tags:
      - "user-v*.*.*+*"

concurrency:
  group: user-cd-${{ github.ref }}
  cancel-in-progress: true        

jobs:
  cd-deploy-user:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3    

      - name: Flutter pub get
        run: flutter pub get

      # Parseamos versionName y versionCode desde el tag
      - name: Extract versionName and versionCode from tag
        id: extract
        run: |
          TAG_NAME="${GITHUB_REF##*/}"
          echo "Tag recibido: $TAG_NAME"

          # Ejemplo esperado: user-v2.0.4+10
          VERSION_NAME=$(echo "$TAG_NAME" | sed -E 's/user-v([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/')
          VERSION_CODE=$(echo "$TAG_NAME" | sed -E 's/.*\+([0-9]+)/\1/')

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "✔ Extraído versionName=$VERSION_NAME, versionCode=$VERSION_CODE"

      - name: Write local.properties versions
        shell: bash
        run: |
          mkdir -p android
          touch android/local.properties
          sed -i '/^flutter\.versionName=/d' android/local.properties || true
          sed -i '/^flutter\.versionCode=/d' android/local.properties || true
          {
            echo "flutter.versionName=${VERSION_NAME}"
            echo "flutter.versionCode=${VERSION_CODE}"
          } >> android/local.properties
          echo "✔ local.properties actualizado:"
          cat android/local.properties

      - name: Restore keystore & key.properties
        run: |
          echo "$KS" | base64 -d > android/app/key.jks
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=key.jks
          EOF
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build appbundle (AAB)
        run: |
          flutter clean
          flutter build appbundle --release
          ls -lah build/app/outputs/bundle/release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: usuario-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab    

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: "com.luisleonidasfernandez.flutterinri"
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal   # podés cambiarlo a alpha, beta o production
          status: completed # queda enviado a revisión automáticamente

      - name: Done
        run: echo "🎉 Usuario publicado en Play Store con tag ${{ github.ref_name }}"
