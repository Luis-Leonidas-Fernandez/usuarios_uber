name: CI (Usuario) - Build, Analyze & Test

on:
  push:
    branches: [ master ]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "android/**"
  pull_request:
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "android/**"

concurrency:
  group: ci-user-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-user:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --no-pub

      # Compila para verificar que Android no rompe (sin firma y sin AAB)
      - name: Build debug APK (verificación)
        run: |
          flutter build apk --debug
          ls -lah build/app/outputs/flutter-apk/

      # Artifact para QA si quieren probar el APK debug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: usuario-apk-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
